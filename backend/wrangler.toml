name = "red-point-backend"
main = "src/index.js"
compatibility_date = "2024-09-23"
compatibility_flags = ["nodejs_compat"]

# ── Secrets (set via CLI — never commit real values) ──────────────────────────
# wrangler secret put DODO_WEBHOOK_SECRET   ← signing secret from Dodo dashboard
# wrangler secret put DODO_PRODUCT_MONTHLY  ← product ID from Dodo
# wrangler secret put DODO_PRODUCT_ANNUAL   ← product ID from Dodo
# wrangler secret put DODO_PRODUCT_LIFETIME ← product ID from Dodo
# wrangler secret put RESEND_API_KEY        ← from resend.com
# wrangler secret put WORKER_URL            ← https://red-point-backend.YOUR_SUBDOMAIN.workers.dev

# ── D1 Database ────────────────────────────────────────────────────────────────
[[d1_databases]]
binding = "DB"
database_name = "red-point-licenses"
database_id = "3b00ca88-2ef0-4aa8-bcda-7c84e39180cf"
